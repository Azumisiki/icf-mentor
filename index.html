<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【準備中】ICF資格更新メンタリングプログラム</title>
<meta name="description" content="ICF資格更新メンタリングプログラムは現在準備中です。募集は一時停止しております。">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Noto+Serif+JP:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16213e;
    --navy-deep:#101830;
    --gold:#c8a24c;
    --gold-bright:#e3c576;
    --ivory:#f4ede0;
    --ivory-soft:rgba(244,237,224,0.72);
    --serif:'Noto Serif JP', serif;
    --display:'Shippori Mincho B1', serif;
    --latin:'Cormorant Garamond', serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:var(--serif);
    color:var(--ivory);
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(200,162,76,0.10), transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    position:relative;
    width:100%;
    max-width:620px;
    padding:64px 40px 56px;
    text-align:center;
    border:1px solid rgba(200,162,76,0.45);
    background:rgba(255,255,255,0.015);
    animation:fade 1.1s ease both;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:9px;
    border:1px solid rgba(200,162,76,0.22);
    pointer-events:none;
  }
  .eyebrow{
    font-family:var(--latin);
    font-style:italic;
    font-size:16px;
    letter-spacing:0.14em;
    color:var(--gold-bright);
    margin-bottom:6px;
  }
  .program{
    font-family:var(--display);
    font-weight:500;
    font-size:15px;
    letter-spacing:0.32em;
    color:var(--ivory-soft);
    margin-bottom:40px;
  }
  .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:0 auto 34px;
    color:var(--gold);
  }
  .ornament .line{width:54px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));}
  .ornament .line.r{background:linear-gradient(90deg,var(--gold),transparent);}
  .ornament .dot{width:6px;height:6px;transform:rotate(45deg);background:var(--gold-bright);}
  h1{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(30px,7vw,42px);
    letter-spacing:0.08em;
    line-height:1.5;
    margin-bottom:22px;
  }
  .lead{
    font-family:var(--display);
    font-weight:500;
    font-size:clamp(16px,4.2vw,19px);
    letter-spacing:0.08em;
    color:var(--gold-bright);
    margin-bottom:30px;
  }
  p.body{
    font-size:15px;
    letter-spacing:0.04em;
    color:var(--ivory-soft);
    max-width:440px;
    margin:0 auto 44px;
  }
  .sign{
    padding-top:26px;
    border-top:1px solid rgba(200,162,76,0.25);
    font-family:var(--display);
    font-weight:500;
    font-size:14px;
    letter-spacing:0.14em;
    color:var(--ivory-soft);
  }
  .sign .name{color:var(--ivory);font-size:16px;letter-spacing:0.2em;display:block;margin-bottom:4px;}
  @keyframes fade{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .card{animation:none;}
  }
  @media (max-width:480px){
    .card{padding:48px 24px 40px;}
    .ornament .line{width:38px;}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Currently Preparing</div>
    <div class="program">ICF資格更新メンタリングプログラム</div>

    <div class="ornament" aria-hidden="true">
      <span class="line"></span><span class="dot"></span><span class="line r"></span>
    </div>

    <h1>現在、準備中です</h1>
    <p class="lead">募集は一時停止しております</p>

    <p class="body">
      より良い内容でお届けするため、開講の時期を改めて検討しております。
      準備が整い次第、こちらのページにて改めてご案内いたします。
      これまでお問い合わせ・お申し込みをいただいた皆さまに、心より御礼申し上げます。
    </p>

    <div class="sign">
      <span class="name">安海 将広</span>
      有限会社以心伝心
    </div>
  </main>
</body>
</html>
